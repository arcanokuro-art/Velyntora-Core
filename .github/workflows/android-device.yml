name: Android device tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest --no-daemon
            adb shell settings put system font_scale 1.8
            gradle :app:connectedDebugAndroidTest --no-daemon --rerun-tasks
      - name: Collect workspace screenshots
        if: always()
        run: adb pull /sdcard/Android/data/art.velyntora.core/files/ workspace-screenshots/ || true
      - name: Print device test failures
        if: failure()
        run: |
          python -c 'import pathlib; [print(p.read_text()) for p in pathlib.Path("app/build/outputs/androidTest-results").rglob("*.xml")]'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-test-results
          path: |
            workspace-screenshots/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
