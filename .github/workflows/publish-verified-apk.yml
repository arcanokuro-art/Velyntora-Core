name: Publish verified APK
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-verified-apk.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-verified-apk-tools
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERIFIED_SHA: b7b056d5ec29a5cd097926cee9dd90523a4190f3
      RELEASE_TAG: v0.1.0-mover-fluido-preview
    steps:
      - uses: actions/checkout@v4
      - name: Require exact source builds and tests
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 38472533839 38472533905 38472533775; do
            for attempt in $(seq 1 85); do
              gh api "repos/$GH_REPO/actions/runs/$run_id" > run.json
              jq -e --arg sha "$VERIFIED_SHA" '.head_sha == $sha and .head_branch == "main"' run.json
              if jq -e '.status == "completed"' run.json >/dev/null; then
                jq -e '.conclusion == "success"' run.json
                break
              fi
              test "$attempt" -lt 85
              sleep 20
            done
          done
          gh api "repos/$GH_REPO/compare/$VERIFIED_SHA...$GITHUB_SHA" --jq '.files' | jq -e 'all(.filename == ".github/workflows/publish-verified-apk.yml")'
      - name: Download the tested APK
        shell: bash
        run: |
          set -euo pipefail
          gh run download 38472533839 --repo "$GH_REPO" --name velyntora-core-debug-apk --dir apk
          test "$(find apk -name '*.apk' -type f | wc -l)" -eq 1
          cp apk/*.apk Velyntora-Core-Movimiento.apk
          sha256sum Velyntora-Core-Movimiento.apk > Velyntora-Core-Movimiento.apk.sha256
      - name: Publish release and assets
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Mover píxeles ejecuta la edición y prepara el fotograma en segundo plano en todos los tamaños de lienzo, incluido 800 × 800 px. Se elimina la segunda actualización completa al soltar la selección. Mover solo el contorno no reconstruye la imagen. Las selecciones pequeñas conservan su contorno exacto.

          Incluye prueba de arrastre continuo con métricas de fotogramas y movimientos consecutivos, además de selección/movimiento en 4031 × 6000 px, exactitud de máscara y deshacer. APK debug del código verificado por compilación, núcleo y Android. SHA-256 adjunta. Versión preliminar para revisar en el dispositivo.

          NOTES
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "Velyntora Core — movimiento de selección" --notes-file notes.md --prerelease
          fi
          gh release upload "$RELEASE_TAG" Velyntora-Core-Movimiento.apk Velyntora-Core-Movimiento.apk.sha256 --repo "$GH_REPO" --clobber
