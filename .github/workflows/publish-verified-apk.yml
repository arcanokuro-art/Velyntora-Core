name: Publish verified APK
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-verified-apk.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-verified-apk-tools
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERIFIED_SHA: fab6cb49e010f1feb067d45a341ad780fa564661
      RELEASE_TAG: v0.1.0-varita-tolerancia-preview
    steps:
      - uses: actions/checkout@v4
      - name: Require exact source builds and tests
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 38464233333 38464233374 38464233414; do
            for attempt in $(seq 1 85); do
              gh api "repos/$GH_REPO/actions/runs/$run_id" > run.json
              jq -e --arg sha "$VERIFIED_SHA" '.head_sha == $sha and .head_branch == "main"' run.json
              if jq -e '.status == "completed"' run.json >/dev/null; then
                jq -e '.conclusion == "success"' run.json
                break
              fi
              test "$attempt" -lt 85
              sleep 20
            done
          done
          gh api "repos/$GH_REPO/compare/$VERIFIED_SHA...$GITHUB_SHA" --jq '.files' | jq -e 'all(.filename == ".github/workflows/publish-verified-apk.yml")'
      - name: Download the tested APK
        shell: bash
        run: |
          set -euo pipefail
          gh run download 38464233333 --repo "$GH_REPO" --name velyntora-core-debug-apk --dir apk
          test "$(find apk -name '*.apk' -type f | wc -l)" -eq 1
          cp apk/*.apk Velyntora-Core-Tolerancia.apk
          sha256sum Velyntora-Core-Tolerancia.apk > Velyntora-Core-Tolerancia.apk.sha256
      - name: Publish release and assets
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Al seleccionar Varita mágica, la barra superior muestra Tolerancia (0–255) en lugar de Anchura del pincel. Se elimina la opción duplicada de tolerancia del menú Herramientas. Las herramientas de dibujo conservan su anchura (1–300 px); cambiar de herramienta conserva ambos parámetros por separado.

          APK debug exacto del código aprobado por compilación, pruebas del núcleo y pruebas Android. SHA-256 adjunta. Versión preliminar para revisar en el dispositivo.

          NOTES
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "Velyntora Core — tolerancia de varita" --notes-file notes.md --prerelease
          fi
          gh release upload "$RELEASE_TAG" Velyntora-Core-Tolerancia.apk Velyntora-Core-Tolerancia.apk.sha256 --repo "$GH_REPO" --clobber
