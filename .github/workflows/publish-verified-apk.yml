name: Publish verified APK
on:
  push:
    branches: [codex/image-layer-transform]
    paths: [.github/workflows/publish-verified-apk.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-verified-apk-tools
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERIFIED_SHA: 09f51c01ee340e3d10fc7432f34b4ad581517b97
      RELEASE_TAG: v0.1.0-pinceles-krita-preview
    steps:
      - uses: actions/checkout@v4
      - name: Require exact source builds and tests
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 39204813516 39204813550 39204813512; do
            for attempt in $(seq 1 85); do
              gh api "repos/$GH_REPO/actions/runs/$run_id" > run.json
              jq -e --arg sha "$VERIFIED_SHA" '.head_sha == $sha and .head_branch == "codex/image-layer-transform"' run.json
              if jq -e '.status == "completed"' run.json >/dev/null; then
                jq -e '.conclusion == "success"' run.json
                break
              fi
              test "$attempt" -lt 85
              sleep 20
            done
          done
          gh api "repos/$GH_REPO/compare/$VERIFIED_SHA...$GITHUB_SHA" --jq '.files' | jq -e 'all(.filename == ".github/workflows/publish-verified-apk.yml")'
      - name: Download the tested APK
        shell: bash
        run: |
          set -euo pipefail
          gh run download 39204813516 --repo "$GH_REPO" --name velyntora-core-debug-apk --dir apk
          test "$(find apk -name '*.apk' -type f | wc -l)" -eq 1
          cp apk/*.apk Velyntora-Core-Pinceles-Krita.apk
          sha256sum Velyntora-Core-Pinceles-Krita.apk > Velyntora-Core-Pinceles-Krita.apk.sha256
      - name: Publish release and assets
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Versión experimental de la rama codex/image-layer-transform. Main permanece sin cambios; pendiente de revisión y aprobación en dispositivo.

          34 presets originales de las colecciones Krita 3 y Krita 4, CC0, clasificados en Aerógrafos (3), Tinta de escritura (5), Marcadores (3), Crayones y pastel (2), Carboncillo (4), Óleo (5), Acuarela (4), Puntas especiales (3) y Mezcla (5). Cada preset conserva su carpeta, archivo KPP original, parámetros, puntas, textura y miniatura. No incluye recursos de HiPaint. Los presets Pastel de Krita 3 forman el grupo Crayones y pastel.

          El desplegable abre categoría y luego pincel, como las figuras. Clásico y suavizado siguen accesibles directamente y conservan sus renderizadores. Selección persistente; anchura 1–300 px y opacidad de herramienta. Nuevo motor modular de sellos con espaciado continuo, presión, texturas, aerógrafo temporizado y mezcla de pigmento en la capa activa. Un trazo corresponde a una entrada del historial.

          Es una adaptación a Velyntora, no el motor completo de Krita ni una equivalencia visual exacta: máscaras de 128×128 y hasta 32 fotogramas, curvas de presión lineales y textura normalizada. No se incluyen todos los sensores de inclinación ni todos los modos de textura o simulación húmeda de Krita. Los originales se conservan para ampliar el soporte. No se ha importado la biblioteca completa de Krita, sino los 34 presets de estos nueve grupos documentados en tools/brush/krita.

          Se mantienen las guías celestes aprobadas, imágenes y textos editables y herramientas anteriores. APK debug para pruebas en codex/image-layer-transform, condicionado a compilación y pruebas de la revisión exacta. Main permanece sin cambios. SHA-256 adjunta.

          NOTES
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "Velyntora Core — pinceles Krita por categorías" --notes-file notes.md --prerelease
          fi
          gh release upload "$RELEASE_TAG" Velyntora-Core-Pinceles-Krita.apk Velyntora-Core-Pinceles-Krita.apk.sha256 --repo "$GH_REPO" --clobber
