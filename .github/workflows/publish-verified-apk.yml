name: Publish verified APK
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-verified-apk.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-verified-apk-tools
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERIFIED_SHA: 47dd222398d6ca1df7b21e22df22c322277ac0a2
      RELEASE_TAG: v0.1.0-tools-preview
    steps:
      - name: Check successful builds and tests
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 38033470882 38033470878 38033470874; do
            gh api "repos/$GH_REPO/actions/runs/$run_id" > run.json
            jq -e --arg sha "$VERIFIED_SHA" '.head_sha == $sha and .head_branch == "main" and .status == "completed" and .conclusion == "success"' run.json
          done
      - name: Download the tested APK
        shell: bash
        run: |
          set -euo pipefail
          gh run download 38033470882 --repo "$GH_REPO" --name velyntora-core-debug-apk --dir apk
          test "$(find apk -name '*.apk' -type f | wc -l)" -eq 1
          cp apk/*.apk Velyntora-Core-Herramientas.apk
          sha256sum Velyntora-Core-Herramientas.apk > Velyntora-Core-Herramientas.apk.sha256
      - name: Publish release and assets
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Reorganización de las 28 herramientas: controlador e icono en su propia carpeta, con código nativo específico junto a cada módulo.

          Se conserva la interfaz de dos columnas y el zoom nítido. Esta versión permite comprobar en el teléfono que la reorganización no haya afectado el comportamiento.

          APK exacto del commit verificado 47dd222398d6ca1df7b21e22df22c322277ac0a2. Compilación Android, 23 suites Java, 16 suites C++ e integraciones JNI aprobadas; 13 pruebas Android aprobadas con fuentes 1.0 y 1.8.

          Descargar Velyntora-Core-Herramientas.apk. Es el APK debug verificado, publicado como versión preliminar de prueba. La suma SHA-256 se adjunta para verificar el archivo.
          NOTES
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "$VERIFIED_SHA" --title "Velyntora Core — herramientas reorganizadas" --notes-file notes.md --prerelease
          fi
          gh release upload "$RELEASE_TAG" Velyntora-Core-Herramientas.apk Velyntora-Core-Herramientas.apk.sha256 --repo "$GH_REPO" --clobber
