name: Publish verified APK
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-verified-apk.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-verified-apk-tools
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERIFIED_SHA: 07a61b80179cfb6c23f3027b3ecf0bb70bb56d14
      RELEASE_TAG: v0.1.0-varita-bloqueo-preview
    steps:
      - uses: actions/checkout@v4
      - name: Require exact source builds and tests
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 38468086222 38468086302 38468086188; do
            for attempt in $(seq 1 85); do
              gh api "repos/$GH_REPO/actions/runs/$run_id" > run.json
              jq -e --arg sha "$VERIFIED_SHA" '.head_sha == $sha and .head_branch == "main"' run.json
              if jq -e '.status == "completed"' run.json >/dev/null; then
                jq -e '.conclusion == "success"' run.json
                break
              fi
              test "$attempt" -lt 85
              sleep 20
            done
          done
          gh api "repos/$GH_REPO/compare/$VERIFIED_SHA...$GITHUB_SHA" --jq '.files' | jq -e 'all(.filename == ".github/workflows/publish-verified-apk.yml")'
      - name: Download the tested APK
        shell: bash
        run: |
          set -euo pipefail
          gh run download 38468086222 --repo "$GH_REPO" --name velyntora-core-debug-apk --dir apk
          test "$(find apk -name '*.apk' -type f | wc -l)" -eq 1
          cp apk/*.apk Velyntora-Core-Varita.apk
          sha256sum Velyntora-Core-Varita.apk > Velyntora-Core-Varita.apk.sha256
      - name: Publish release and assets
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          La varita prepara el contorno de selecciones grandes en segundo plano. La selección conserva su región exacta para editar; solo la representación del borde se limita para evitar una geometría excesiva en la pantalla. El movimiento de píxeles de selecciones grandes prepara la máscara exacta y ejecuta el cambio de imagen fuera del hilo de interfaz.

          Se conserva Tolerancia en la barra superior. Incluye pruebas de selección y movimiento en 4031 × 6000 px, respuesta del hilo principal, máscara con huecos y deshacer, además de las pruebas existentes. APK debug exacto del código verificado. SHA-256 adjunta. Versión preliminar para comprobar en el dispositivo.

          NOTES
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "Velyntora Core — selección grande sin bloqueo" --notes-file notes.md --prerelease
          fi
          gh release upload "$RELEASE_TAG" Velyntora-Core-Varita.apk Velyntora-Core-Varita.apk.sha256 --repo "$GH_REPO" --clobber
