name: Publish verified APK
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-verified-apk.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-verified-apk-tools
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERIFIED_SHA: 0b0b8d78dffc32daa0bde2afe2e4ec4bdec51401
      RELEASE_TAG: v0.1.0-seleccion-arrastre-preview
    steps:
      - uses: actions/checkout@v4
      - name: Require exact source builds and tests
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 38795535867 38795535880 38795535862; do
            for attempt in $(seq 1 85); do
              gh api "repos/$GH_REPO/actions/runs/$run_id" > run.json
              jq -e --arg sha "$VERIFIED_SHA" '.head_sha == $sha and .head_branch == "main"' run.json
              if jq -e '.status == "completed"' run.json >/dev/null; then
                jq -e '.conclusion == "success"' run.json
                break
              fi
              test "$attempt" -lt 85
              sleep 20
            done
          done
          gh api "repos/$GH_REPO/compare/$VERIFIED_SHA...$GITHUB_SHA" --jq '.files' | jq -e 'all(.filename == ".github/workflows/publish-verified-apk.yml")'
      - name: Download the tested APK
        shell: bash
        run: |
          set -euo pipefail
          gh run download 38795535867 --repo "$GH_REPO" --name velyntora-core-debug-apk --dir apk
          test "$(find apk -name '*.apk' -type f | wc -l)" -eq 1
          cp apk/*.apk Velyntora-Core-Seleccion.apk
          sha256sum Velyntora-Core-Seleccion.apk > Velyntora-Core-Seleccion.apk.sha256
      - name: Publish release and assets
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Corrección centrada en el arrastre de selecciones: el contorno irregular acompaña al gesto mediante traslación visual. En documentos pequeños de una sola capa normal y opaca, una vista previa temporal mueve los píxeles durante el gesto sin recomponerlos por cada evento. Preparación en segundo plano; cancelar descarta la vista previa y soltar aplica el movimiento mediante la operación existente. Los documentos con varias capas conservan su composición normal y el contorno móvil. Actualización de coordenadas agrupada por fotograma solo para herramientas de movimiento de selección.

          Pruebas de posición visual, cancelación sin edición ni historial, aplicación al soltar, deshacer y protección de composición multicapa, junto con pruebas de arrastre continuo y las demás herramientas. Algoritmos de tools, JNI y sesión nativa intactos. APK debug del código verificado; SHA-256 adjunta. Versión preliminar para comprobar la respuesta en el dispositivo.

          NOTES
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "Velyntora Core — vista previa de selección" --notes-file notes.md --prerelease
          fi
          gh release upload "$RELEASE_TAG" Velyntora-Core-Seleccion.apk Velyntora-Core-Seleccion.apk.sha256 --repo "$GH_REPO" --clobber
