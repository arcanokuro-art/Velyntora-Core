name: Publish verified APK
on:
  push:
    branches: [codex/image-layer-transform]
    paths: [.github/workflows/publish-verified-apk.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-verified-apk-tools
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERIFIED_SHA: bce4035af9617009cc2190ba4c772ba17257b545
      RELEASE_TAG: v0.1.0-guias-alineacion-preview
    steps:
      - uses: actions/checkout@v4
      - name: Require exact source builds and tests
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 39186888417 39186888403 39186888318; do
            for attempt in $(seq 1 85); do
              gh api "repos/$GH_REPO/actions/runs/$run_id" > run.json
              jq -e --arg sha "$VERIFIED_SHA" '.head_sha == $sha and .head_branch == "codex/image-layer-transform"' run.json
              if jq -e '.status == "completed"' run.json >/dev/null; then
                jq -e '.conclusion == "success"' run.json
                break
              fi
              test "$attempt" -lt 85
              sleep 20
            done
          done
          gh api "repos/$GH_REPO/compare/$VERIFIED_SHA...$GITHUB_SHA" --jq '.files' | jq -e 'all(.filename == ".github/workflows/publish-verified-apk.yml")'
      - name: Download the tested APK
        shell: bash
        run: |
          set -euo pipefail
          gh run download 39186888417 --repo "$GH_REPO" --name velyntora-core-debug-apk --dir apk
          test "$(find apk -name '*.apk' -type f | wc -l)" -eq 1
          cp apk/*.apk Velyntora-Core-Guias-Alineacion.apk
          sha256sum Velyntora-Core-Guias-Alineacion.apk > Velyntora-Core-Guias-Alineacion.apk.sha256
      - name: Publish release and assets
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Versión experimental de la rama codex/image-layer-transform. Main permanece sin cambios; pendiente de revisión y aprobación en dispositivo.

          Guías celestes temporales al mover y girar capas editables de imagen y texto. Al arrastrar, cada eje encaja en el centro del lienzo dentro de un margen de 8 dp en pantalla, independiente del zoom. Al girar, encaja en múltiplos de 90 grados dentro de 3 grados. Las guías desaparecen al soltar o cancelar; no se guardan ni se exportan. El gesto conserva deshacer y rehacer y cancelar restaura la transformación original.

          Módulo independiente AlignmentGuides compartido por imágenes y textos. Dos nuevas pruebas cubren ajuste por eje, liberación, ángulos negativos y varias vueltas, sin alterar tamaño. Se conservan las herramientas protegidas. Esta versión no incorpora guías para mover píxeles de capas rasterizadas ni alineación entre objetos: las referencias son el centro y los ejes del lienzo.

          APK de pruebas condicionado a la compilación y las pruebas exactas de esta revisión. SHA-256 adjunta. Main permanece intacta.

          NOTES
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "Velyntora Core — guías de alineación" --notes-file notes.md --prerelease
          fi
          gh release upload "$RELEASE_TAG" Velyntora-Core-Guias-Alineacion.apk Velyntora-Core-Guias-Alineacion.apk.sha256 --repo "$GH_REPO" --clobber
