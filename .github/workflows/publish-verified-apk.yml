name: Publish verified APK
on:
  push:
    branches: [codex/image-layer-transform]
    paths: [.github/workflows/publish-verified-apk.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-verified-apk-tools
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERIFIED_SHA: c892f2af3811bcc6377bee05279d251d6cd37fb8
      RELEASE_TAG: v0.1.0-insertar-imagen-preview
    steps:
      - uses: actions/checkout@v4
      - name: Require exact source builds and tests
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 39097997336 39097997385 39097997329; do
            for attempt in $(seq 1 85); do
              gh api "repos/$GH_REPO/actions/runs/$run_id" > run.json
              jq -e --arg sha "$VERIFIED_SHA" '.head_sha == $sha and .head_branch == "codex/image-layer-transform"' run.json
              if jq -e '.status == "completed"' run.json >/dev/null; then
                jq -e '.conclusion == "success"' run.json
                break
              fi
              test "$attempt" -lt 85
              sleep 20
            done
          done
          gh api "repos/$GH_REPO/compare/$VERIFIED_SHA...$GITHUB_SHA" --jq '.files' | jq -e 'all(.filename == ".github/workflows/publish-verified-apk.yml")'
      - name: Download the tested APK
        shell: bash
        run: |
          set -euo pipefail
          gh run download 39097997336 --repo "$GH_REPO" --name velyntora-core-debug-apk --dir apk
          test "$(find apk -name '*.apk' -type f | wc -l)" -eq 1
          cp apk/*.apk Velyntora-Core-Insertar-Imagen.apk
          sha256sum Velyntora-Core-Insertar-Imagen.apk > Velyntora-Core-Insertar-Imagen.apk.sha256
      - name: Publish release and assets
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Versión experimental de la rama codex/image-layer-transform. Main permanece sin cambios; pendiente de revisión y aprobación en dispositivo.

          Archivo > Insertar imagen como capa permite mover, redimensionar desde bordes y esquinas, girar, ajustar opacidad y recortar la imagen antes de confirmar. ✓ crea una capa nueva con un solo paso de deshacer; X cancela la inserción. El recorte incluye proporciones y cuadrícula. Al confirmar se rasteriza la imagen en la capa; esta versión no reabre la transformación original después de confirmar.

          Arquitectura modular en components/images: insertion, transformation, crop y session. Decodificación por regiones y confirmación por bloques. Se conserva el límite de 6000 px por lado, con confirmación para reducir imágenes mayores. APK debug publicado solo después de compilar y pasar pruebas del motor y de Android. SHA-256 adjunta.

          NOTES
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "Velyntora Core — insertar y transformar imagen" --notes-file notes.md --prerelease
          fi
          gh release upload "$RELEASE_TAG" Velyntora-Core-Insertar-Imagen.apk Velyntora-Core-Insertar-Imagen.apk.sha256 --repo "$GH_REPO" --clobber
