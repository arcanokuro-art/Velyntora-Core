name: Publish verified APK
on:
  push:
    branches: [codex/image-layer-transform]
    paths: [.github/workflows/publish-verified-apk.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-verified-apk-tools
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERIFIED_SHA: 8321c9c0963e518aa2bb27d1be53d899bc4ac2d3
      RELEASE_TAG: v0.1.0-texto-editable-preview
    steps:
      - uses: actions/checkout@v4
      - name: Require exact source builds and tests
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 39102403396 39102403377 39102403431; do
            for attempt in $(seq 1 85); do
              gh api "repos/$GH_REPO/actions/runs/$run_id" > run.json
              jq -e --arg sha "$VERIFIED_SHA" '.head_sha == $sha and .head_branch == "codex/image-layer-transform"' run.json
              if jq -e '.status == "completed"' run.json >/dev/null; then
                jq -e '.conclusion == "success"' run.json
                break
              fi
              test "$attempt" -lt 85
              sleep 20
            done
          done
          gh api "repos/$GH_REPO/compare/$VERIFIED_SHA...$GITHUB_SHA" --jq '.files' | jq -e 'all(.filename == ".github/workflows/publish-verified-apk.yml")'
      - name: Download the tested APK
        shell: bash
        run: |
          set -euo pipefail
          gh run download 39102403396 --repo "$GH_REPO" --name velyntora-core-debug-apk --dir apk
          test "$(find apk -name '*.apk' -type f | wc -l)" -eq 1
          cp apk/*.apk Velyntora-Core-Texto-Editable.apk
          sha256sum Velyntora-Core-Texto-Editable.apk > Velyntora-Core-Texto-Editable.apk.sha256
      - name: Publish release and assets
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Versión experimental de la rama codex/image-layer-transform. Main permanece sin cambios; pendiente de revisión y aprobación en dispositivo.

          La herramienta Texto crea una capa independiente. Escribe y pulsa Aplicar para ver el elemento; ajusta posición, tamaño, giro y opacidad y confirma con ✓. Después, selecciona su capa o toca el texto de la capa activa y usa Editar texto para cambiar las palabras, fuente, tamaño, color ARGB, negrita, cursiva o ancho de ajuste. X descarta toda la edición pendiente; Cancelar en el cuadro de texto descarta solo lo escrito en ese cuadro.

          Deshacer y rehacer conservan contenido, formato y colocación. El proyecto nativo VLYCORE v4 guarda texto Unicode editable, incluidos saltos de línea, y conserva las imágenes editables aprobadas. Los proyectos v1/v2/v3 siguen siendo legibles. Los proyectos que contienen texto editable requieren esta versión o una posterior. Exportar PNG/JPEG u OpenRaster conserva el resultado visible, sin la edición de palabras. Efectos de píxeles, combinar o cambiar dimensiones del documento rasterizan la capa afectada; deshacer recupera sus datos editables.

          Arquitectura modular: components/text/model, rendering y session; core/components/text; puente nativo propio. Caché de glifos generada por franjas fuera de la interfaz, sin un bitmap del tamaño de todo el lienzo. Se mantiene el límite de 6000 px por lado, el límite de 32 capas y la edición de imágenes. APK debug condicionado a compilación y pruebas exactas del motor y de Android. SHA-256 adjunta. Main permanece intacta.

          NOTES
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "Velyntora Core — texto editable por capa" --notes-file notes.md --prerelease
          fi
          gh release upload "$RELEASE_TAG" Velyntora-Core-Texto-Editable.apk Velyntora-Core-Texto-Editable.apk.sha256 --repo "$GH_REPO" --clobber
