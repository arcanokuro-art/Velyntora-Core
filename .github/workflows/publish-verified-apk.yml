name: Publish verified APK
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-verified-apk.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-verified-apk-tools
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERIFIED_SHA: 16e2e278c74a558c95ab389f17bc021ded3d9020
      RELEASE_TAG: v0.1.0-anchura-contextual-preview
    steps:
      - uses: actions/checkout@v4
      - name: Require exact source builds and tests
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 39092567129 39092567296 39092567128; do
            for attempt in $(seq 1 85); do
              gh api "repos/$GH_REPO/actions/runs/$run_id" > run.json
              jq -e --arg sha "$VERIFIED_SHA" '.head_sha == $sha and .head_branch == "main"' run.json
              if jq -e '.status == "completed"' run.json >/dev/null; then
                jq -e '.conclusion == "success"' run.json
                break
              fi
              test "$attempt" -lt 85
              sleep 20
            done
          done
          gh api "repos/$GH_REPO/compare/$VERIFIED_SHA...$GITHUB_SHA" --jq '.files' | jq -e 'all(.filename == ".github/workflows/publish-verified-apk.yml")'
      - name: Download the tested APK
        shell: bash
        run: |
          set -euo pipefail
          gh run download 39092567129 --repo "$GH_REPO" --name velyntora-core-debug-apk --dir apk
          test "$(find apk -name '*.apk' -type f | wc -l)" -eq 1
          cp apk/*.apk Velyntora-Core-Anchura-Contextual.apk
          sha256sum Velyntora-Core-Anchura-Contextual.apk > Velyntora-Core-Anchura-Contextual.apk.sha256
      - name: Publish release and assets
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          La barra superior oculta Anchura del pincel y su deslizador en Mover píxeles/contorno, cubeta, degradado, zoom, cuentagotas, desplazamiento, texto, selecciones y figuras rellenas. Conserva el grosor en las herramientas que lo utilizan y Tolerancia en la varita mágica. Los valores se mantienen al cambiar de herramienta.

          Política de visibilidad separada en components/toolbar/ToolWidthPolicy.java. No cambia los algoritmos de las herramientas. Prueba Android de las 29 herramientas, visibilidad de etiqueta/deslizador, rangos y conservación de valores, además de las pruebas existentes. APK debug del código verificado. SHA-256 adjunta. Versión preliminar para revisar en dispositivo.

          NOTES
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "Velyntora Core — anchura solo donde corresponde" --notes-file notes.md --prerelease
          fi
          gh release upload "$RELEASE_TAG" Velyntora-Core-Anchura-Contextual.apk Velyntora-Core-Anchura-Contextual.apk.sha256 --repo "$GH_REPO" --clobber
