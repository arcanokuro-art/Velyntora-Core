name: Publish verified APK
on:
  push:
    branches: [codex/line-curve-delete-point]
    paths: [.github/workflows/publish-verified-apk.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-verified-apk-tools
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERIFIED_SHA: 871da4c7c9accab15308f6d162cd6bdf8e5aab7e
      RELEASE_TAG: v0.1.0-linea-borrar-punto-preview
    steps:
      - uses: actions/checkout@v4
      - name: Require exact source builds and tests
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 39074003326 39074003324 39074003358; do
            for attempt in $(seq 1 85); do
              gh api "repos/$GH_REPO/actions/runs/$run_id" > run.json
              jq -e --arg sha "$VERIFIED_SHA" '.head_sha == $sha and .head_branch == "codex/line-curve-delete-point"' run.json
              if jq -e '.status == "completed"' run.json >/dev/null; then
                jq -e '.conclusion == "success"' run.json
                break
              fi
              test "$attempt" -lt 85
              sleep 20
            done
          done
          gh api "repos/$GH_REPO/compare/$VERIFIED_SHA...$GITHUB_SHA" --jq '.files' | jq -e 'all(.filename == ".github/workflows/publish-verified-apk.yml")'
      - name: Download the tested APK
        shell: bash
        run: |
          set -euo pipefail
          gh run download 39074003326 --repo "$GH_REPO" --name velyntora-core-debug-apk --dir apk
          test "$(find apk -name '*.apk' -type f | wc -l)" -eq 1
          cp apk/*.apk Velyntora-Core-Borrar-Punto.apk
          sha256sum Velyntora-Core-Borrar-Punto.apk > Velyntora-Core-Borrar-Punto.apk.sha256
      - name: Publish release and assets
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          APK experimental de la rama codex/line-curve-delete-point. Main permanece intacta; esta modificación no está integrada en la versión principal.

          Un toque breve en un punto interior existente de Línea/Curva abre Borrar punto junto a él. Borrar elimina solo ese nodo, conserva ambos extremos y permite seguir editando el trazo. Se puede deshacer/rehacer la eliminación. Arrastrar sigue moviendo el nodo; los extremos no abren este menú ni se pueden borrar. Se conserva la edición de tensión existente.

          Arquitectura modular: tools/line_curve/points. Pruebas de menú real, borrado, extremos, arrastre, inserción, historial y confirmación, además de las pruebas existentes. APK debug exacto del código verificado. SHA-256 adjunta. No se fusionará con main sin aprobación del usuario después de probarlo.

          NOTES
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "Velyntora Core — borrar punto interior (rama de prueba)" --notes-file notes.md --prerelease
          fi
          gh release upload "$RELEASE_TAG" Velyntora-Core-Borrar-Punto.apk Velyntora-Core-Borrar-Punto.apk.sha256 --repo "$GH_REPO" --clobber
