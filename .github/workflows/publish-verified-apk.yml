name: Publish verified APK
on:
  push:
    branches: [codex/image-layer-transform]
    paths: [.github/workflows/publish-verified-apk.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-verified-apk-tools
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERIFIED_SHA: 95cf5fa52810dfabd41957011a392dbcb4426e27
      RELEASE_TAG: v0.1.0-imagen-editable-preview
    steps:
      - uses: actions/checkout@v4
      - name: Require exact source builds and tests
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 39100164228 39100164264 39100164260; do
            for attempt in $(seq 1 85); do
              gh api "repos/$GH_REPO/actions/runs/$run_id" > run.json
              jq -e --arg sha "$VERIFIED_SHA" '.head_sha == $sha and .head_branch == "codex/image-layer-transform"' run.json
              if jq -e '.status == "completed"' run.json >/dev/null; then
                jq -e '.conclusion == "success"' run.json
                break
              fi
              test "$attempt" -lt 85
              sleep 20
            done
          done
          gh api "repos/$GH_REPO/compare/$VERIFIED_SHA...$GITHUB_SHA" --jq '.files' | jq -e 'all(.filename == ".github/workflows/publish-verified-apk.yml")'
      - name: Download the tested APK
        shell: bash
        run: |
          set -euo pipefail
          gh run download 39100164228 --repo "$GH_REPO" --name velyntora-core-debug-apk --dir apk
          test "$(find apk -name '*.apk' -type f | wc -l)" -eq 1
          cp apk/*.apk Velyntora-Core-Imagen-Editable.apk
          sha256sum Velyntora-Core-Imagen-Editable.apk > Velyntora-Core-Imagen-Editable.apk.sha256
      - name: Publish release and assets
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Versión experimental de la rama codex/image-layer-transform. Main permanece sin cambios; pendiente de revisión y aprobación en dispositivo.

          Archivo > Insertar imagen como capa conserva el original y su configuración. Después de ✓, selecciona su capa o toca la imagen para volver a moverla, redimensionarla, girarla, recortarla o cambiar su opacidad. ✓ actualiza la misma capa con un paso de deshacer; X descarta la edición. Se respetan las capas superiores y los modos de mezcla en la vista previa.

          El proyecto nativo VLYCORE conserva los originales y transformaciones al guardar y abrir. Las fuentes comprimidas se guardan en disco y se comparten entre duplicados e historial. Los proyectos anteriores siguen siendo compatibles. Los proyectos nuevos que contienen imágenes editables requieren esta versión o una posterior.

          Arquitectura modular en components/images y core/components/images. Límite de 6000 px por lado. Texto fuera de este cambio. Pintar o aplicar efectos a la capa, combinar capas o cambiar las dimensiones del documento convierte el resultado en píxeles normales. También puedes rasterizar explícitamente desde propiedades de capa; deshacer recupera la imagen editable. PNG/JPEG y OpenRaster exportan el resultado visible, sin conservar la transformación original. APK debug publicado solo tras aprobar compilación y pruebas exactas de la fuente. SHA-256 adjunta.

          NOTES
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "Velyntora Core — imagen editable después de confirmar" --notes-file notes.md --prerelease
          fi
          gh release upload "$RELEASE_TAG" Velyntora-Core-Imagen-Editable.apk Velyntora-Core-Imagen-Editable.apk.sha256 --repo "$GH_REPO" --clobber
