name: Publish verified APK
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-verified-apk.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-verified-apk-tools
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERIFIED_SHA: 8ddf4b55a4fa8a57b0516328416a57cdaa5ec962
      RELEASE_TAG: v0.1.0-figuras-preview
    steps:
      - uses: actions/checkout@v4
      - name: Require exact source builds and tests
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 38202302439 38202302412 38202302421; do
            for attempt in $(seq 1 85); do
              gh api "repos/$GH_REPO/actions/runs/$run_id" > run.json
              jq -e --arg sha "$VERIFIED_SHA" '.head_sha == $sha and .head_branch == "main"' run.json
              if jq -e '.status == "completed"' run.json >/dev/null; then
                jq -e '.conclusion == "success"' run.json
                break
              fi
              test "$attempt" -lt 85
              sleep 20
            done
          done
          gh api "repos/$GH_REPO/compare/$VERIFIED_SHA...$GITHUB_SHA" --jq '.files' | jq -e 'all(.filename == ".github/workflows/publish-verified-apk.yml")'
      - name: Download the tested APK
        shell: bash
        run: |
          set -euo pipefail
          gh run download 38202302439 --repo "$GH_REPO" --name velyntora-core-debug-apk --dir apk
          test "$(find apk -name '*.apk' -type f | wc -l)" -eq 1
          cp apk/*.apk Velyntora-Core-Figuras.apk
          sha256sum Velyntora-Core-Figuras.apk > Velyntora-Core-Figuras.apk.sha256
      - name: Publish release and assets
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Un solo botón Figuras abre dos grupos: Sin relleno (rectángulo, rectángulo redondeado, elipse, triángulo y círculo) y Con relleno (rectángulo, elipse, rectángulo redondeado y triángulo). Cada figura conserva su controlador e icono en su propia carpeta dentro de tools/figuras. Los algoritmos de dibujo, identificadores y firmas JNI se conservan.

          El selector permite escoger una figura y recuerda la última elegida. Abrir o cerrar el menú no cambia la herramienta activa. Se conservan ancho, opacidad, colores y las mejoras aprobadas del lienzo, historial y panel de capas.

          Comprobaciones de dibujo, relleno/contorno y deshacer/rehacer para las nueve figuras, además de navegación real de ambos grupos del desplegable y capturas Android con texto normal y grande. APK debug exacto de 8ddf4b55a4fa8a57b0516328416a57cdaa5ec962, publicado después de aprobar compilación, núcleo y pruebas Android. SHA-256 adjunta. Versión preliminar para comprobar en el dispositivo.

          NOTES
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "Velyntora Core — figuras por grupos" --notes-file notes.md --prerelease
          fi
          gh release upload "$RELEASE_TAG" Velyntora-Core-Figuras.apk Velyntora-Core-Figuras.apk.sha256 --repo "$GH_REPO" --clobber
