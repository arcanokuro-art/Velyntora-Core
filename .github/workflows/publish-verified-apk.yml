name: Publish verified APK
on:
  push:
    branches: [codex/image-layer-transform]
    paths: [.github/workflows/publish-verified-apk.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-verified-apk-tools
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERIFIED_SHA: 0df1fdfcdc0ecb052ecc46ae607857d1573384e6
      RELEASE_TAG: v0.1.0-texto-nitido-preview
    steps:
      - uses: actions/checkout@v4
      - name: Require exact source builds and tests
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 39164270811 39164270828 39164270842; do
            for attempt in $(seq 1 85); do
              gh api "repos/$GH_REPO/actions/runs/$run_id" > run.json
              jq -e --arg sha "$VERIFIED_SHA" '.head_sha == $sha and .head_branch == "codex/image-layer-transform"' run.json
              if jq -e '.status == "completed"' run.json >/dev/null; then
                jq -e '.conclusion == "success"' run.json
                break
              fi
              test "$attempt" -lt 85
              sleep 20
            done
          done
          gh api "repos/$GH_REPO/compare/$VERIFIED_SHA...$GITHUB_SHA" --jq '.files' | jq -e 'all(.filename == ".github/workflows/publish-verified-apk.yml")'
      - name: Download the tested APK
        shell: bash
        run: |
          set -euo pipefail
          gh run download 39164270811 --repo "$GH_REPO" --name velyntora-core-debug-apk --dir apk
          test "$(find apk -name '*.apk' -type f | wc -l)" -eq 1
          cp apk/*.apk Velyntora-Core-Texto-Nitido.apk
          sha256sum Velyntora-Core-Texto-Nitido.apk > Velyntora-Core-Texto-Nitido.apk.sha256
      - name: Publish release and assets
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Versión experimental de la rama codex/image-layer-transform. Main permanece sin cambios; pendiente de revisión y aprobación en dispositivo.

          Barra de edición con márgenes explícitos entre Texto, Editar texto, giro, Proporciones, Opacidad y ✓/X. Tamaño y ancho máximo se ajustan con deslizadores y valores en píxeles, con muestra vectorial inmediata dentro del cuadro de configuración.

          Color del texto abre un selector independiente con rueda/plano, HSV, RGB y alfa. Aceptar o cancelar este selector no modifica los colores del pincel. El tamaño mostrado al reabrir la configuración tiene en cuenta el escalado de los tiradores; aplicar tipografía normaliza la escala vertical para no duplicar el aumento y conserva el estiramiento horizontal.

          Edición y confirmación dibujan los glifos a la resolución correspondiente, sin ampliar la pequeña caché de origen. Las capas de texto usan glifos vectoriales durante la edición con composición de los planos inferiores y superiores. El modo RGB xor y los modos avanzados en Android anterior a 29 conservan el compositor nativo de respaldo. Al confirmar siempre se dibujan glifos en bloques a resolución del documento. Se mantienen texto Unicode editable, guardar/abrir proyecto nativo, deshacer/rehacer, imágenes editables y límite de lienzo de 6000 px por lado. Rango tipográfico 4–6000 px, con validación de los límites del bloque de texto antes de aplicar.

          Arquitectura modular de texto, vistas previas y renderizado. APK debug condicionado a las compilaciones y pruebas exactas del código fuente. SHA-256 adjunta. Rama codex/image-layer-transform: main permanece intacta, pendiente de aprobación del usuario.

          NOTES
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "Velyntora Core — texto nítido y controles visuales" --notes-file notes.md --prerelease
          fi
          gh release upload "$RELEASE_TAG" Velyntora-Core-Texto-Nitido.apk Velyntora-Core-Texto-Nitido.apk.sha256 --repo "$GH_REPO" --clobber
