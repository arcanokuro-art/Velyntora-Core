name: Publish tool response APK
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-tool-response-apk.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-remove-ai-toolbar-fix
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERIFIED_SHA: 13fbbe14a2551a5de5a228e9aa44295a2e64671b
      RELEASE_TAG: v0.1.0-remove-ai-toolbar-fix
    steps:
      - name: Wait for the exact source build and tests
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 38095643290 38095643261 38095643294; do
            for attempt in $(seq 1 85); do
              gh api "repos/$GH_REPO/actions/runs/$run_id" > run.json
              jq -e --arg sha "$VERIFIED_SHA" '.head_sha == $sha and .head_branch == "main"' run.json
              if jq -e '.status == "completed"' run.json >/dev/null; then
                jq -e '.conclusion == "success"' run.json
                break
              fi
              test "$attempt" -lt 85
              sleep 20
            done
          done
      - name: Download the APK from the successful source build
        shell: bash
        run: |
          set -euo pipefail
          gh run download 38095643290 --repo "$GH_REPO" --name velyntora-core-debug-apk --dir apk
          test "$(find apk -name '*.apk' -type f | wc -l)" -eq 1
          cp apk/*.apk Velyntora-Core-Remove-AI.apk
          sha256sum Velyntora-Core-Remove-AI.apk > Velyntora-Core-Remove-AI.apk.sha256
      - name: Publish the updated APK
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Corrige los botones Eliminar y Limpiar máscara de Remove AI después de reorganizar la interfaz o cambiar la orientación. Antes podían conservar una instancia cerrada aunque la máscara siguiera pintándose; ahora resuelven la instancia activa en cada pulsación.
          Prueba Android de los botones reales tras dos reorganizaciones, comprobando limpieza, inferencia, cambio de píxeles y Deshacer. Conserva MI-GAN 512 local, modelo incluido, cancelación, alfa y exterior de la máscara.
          Línea/Curva y las otras herramientas permanecen intactas.
          APK debug del commit 13fbbe14a2551a5de5a228e9aa44295a2e64671b, publicado tras aprobar compilación, núcleo y Android con fuentes normal y ampliada. SHA256 adjunta.
          NOTES
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "${{ github.sha }}" --title "Velyntora Core — corrección Remove AI" --notes-file notes.md --prerelease
          fi
          gh release upload "$RELEASE_TAG" Velyntora-Core-Remove-AI.apk Velyntora-Core-Remove-AI.apk.sha256 --repo "$GH_REPO" --clobber
