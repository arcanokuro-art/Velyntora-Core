name: Publish tool response APK
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-tool-response-apk.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-saved-colors
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERIFIED_SHA: eb0c1d2335fc3e6ccdb27d9401636f407ffd7e7f
      RELEASE_TAG: v0.1.0-saved-colors-preview
    steps:
      - name: Wait for the exact source build and tests
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 38109710685 38109710710 38109710743; do
            for attempt in $(seq 1 85); do
              gh api "repos/$GH_REPO/actions/runs/$run_id" > run.json
              jq -e --arg sha "$VERIFIED_SHA" '.head_sha == $sha and .head_branch == "main"' run.json
              if jq -e '.status == "completed"' run.json >/dev/null; then
                jq -e '.conclusion == "success"' run.json
                break
              fi
              test "$attempt" -lt 85
              sleep 20
            done
          done
      - name: Download the APK from the successful source build
        shell: bash
        run: |
          set -euo pipefail
          gh run download 38109710685 --repo "$GH_REPO" --name velyntora-core-debug-apk --dir apk
          test "$(find apk -name '*.apk' -type f | wc -l)" -eq 1
          cp apk/*.apk Velyntora-Core-Colores.apk
          sha256sum Velyntora-Core-Colores.apk > Velyntora-Core-Colores.apk.sha256
      - name: Publish the updated APK
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Colores personalizados persistentes en la paleta inferior, en su propio módulo components/color/palette/saved con modelo, almacenamiento y controles separados.
          El botón + guarda el color activo; mantenerlo pulsado permite guardar el secundario. Toque en una muestra guardada para reutilizarla; mantener pulsado para usarla como secundario o eliminarla.
          Conserva transparencia, orden y colores tras cerrar y abrir la aplicación, evita duplicados y admite hasta 64 colores personalizados. Paleta predeterminada y herramientas conservadas.
          Pruebas de codificación ARGB, límites y datos inválidos; pruebas Android de guardado, reutilización, reinicio de actividad, secundario y eliminación con texto normal y ampliado.
          APK debug del commit eb0c1d2335fc3e6ccdb27d9401636f407ffd7e7f, publicado únicamente tras aprobar compilación, núcleo y Android. SHA256 adjunta.
          NOTES
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "${{ github.sha }}" --title "Velyntora Core — colores guardados" --notes-file notes.md --prerelease
          fi
          gh release upload "$RELEASE_TAG" Velyntora-Core-Colores.apk Velyntora-Core-Colores.apk.sha256 --repo "$GH_REPO" --clobber
