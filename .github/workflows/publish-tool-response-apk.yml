name: Publish tool response APK
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-tool-response-apk.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-color-layout-verified-apk
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERIFIED_SHA: 797182127be75d1cd4ca0bb2f6913ea2dc7f5413
      RELEASE_TAG: v0.1.0-color-picker-layout-preview
    steps:
      - name: Wait for the exact source build and tests
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 38073740966 38073740800 38073740796; do
            for attempt in $(seq 1 85); do
              gh api "repos/$GH_REPO/actions/runs/$run_id" > run.json
              jq -e --arg sha "$VERIFIED_SHA" '.head_sha == $sha and .head_branch == "main"' run.json
              if jq -e '.status == "completed"' run.json >/dev/null; then
                jq -e '.conclusion == "success"' run.json
                break
              fi
              test "$attempt" -lt 85
              sleep 20
            done
          done
      - name: Download the APK from the successful source build
        shell: bash
        run: |
          set -euo pipefail
          gh run download 38073740966 --repo "$GH_REPO" --name velyntora-core-debug-apk --dir apk
          test "$(find apk -name '*.apk' -type f | wc -l)" -eq 1
          cp apk/*.apk Velyntora-Core-Colores-Ordenados.apk
          sha256sum Velyntora-Core-Colores-Ordenados.apk > Velyntora-Core-Colores-Ordenados.apk.sha256
      - name: Publish the updated APK
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Panel de color reorganizado con separación entre columnas, etiquetas medidas según tamaño de letra, márgenes y botones separados. Selector de color inspirado en Pinta: círculo de tono/saturación, cuadrado de saturación/valor, HSV, RGBA, hexadecimal RRGGBBAA y muestras de ambos colores.
          Edición local hasta Aceptar; Cancelar descarta; Restablecer recupera ambos colores iniciales.
          APK debug del commit 797182127be75d1cd4ca0bb2f6913ea2dc7f5413. Compilación y pruebas Android verificadas antes de publicar.
          Descargar Velyntora-Core-Colores-Ordenados.apk. SHA-256 adjunta.
          NOTES
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "${{ github.sha }}" --title "Velyntora Core — selector de colores" --notes-file notes.md --prerelease
          fi
          gh release upload "$RELEASE_TAG" Velyntora-Core-Colores-Ordenados.apk Velyntora-Core-Colores-Ordenados.apk.sha256 --repo "$GH_REPO" --clobber
