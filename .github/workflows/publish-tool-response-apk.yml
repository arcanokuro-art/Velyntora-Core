name: Publish tool response APK
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-tool-response-apk.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-modular-components-apk
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERIFIED_SHA: be1272a7b0a7a9b5094a2af286a496cf685d4288
      RELEASE_TAG: v0.1.0-modular-components-preview
    steps:
      - name: Wait for the exact source build and tests
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 38076709587 38076709592 38076709595; do
            for attempt in $(seq 1 85); do
              gh api "repos/$GH_REPO/actions/runs/$run_id" > run.json
              jq -e --arg sha "$VERIFIED_SHA" '.head_sha == $sha and .head_branch == "main"' run.json
              if jq -e '.status == "completed"' run.json >/dev/null; then
                jq -e '.conclusion == "success"' run.json
                break
              fi
              test "$attempt" -lt 85
              sleep 20
            done
          done
      - name: Download the APK from the successful source build
        shell: bash
        run: |
          set -euo pipefail
          gh run download 38076709587 --repo "$GH_REPO" --name velyntora-core-debug-apk --dir apk
          test "$(find apk -name '*.apk' -type f | wc -l)" -eq 1
          cp apk/*.apk Velyntora-Core-Modular.apk
          sha256sum Velyntora-Core-Modular.apk > Velyntora-Core-Modular.apk.sha256
      - name: Publish the updated APK
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Código existente organizado por componentes: colores, capas, selección, historial, menús, barras, texto, documento, codecs, entrada y renderizado.
          Herramientas protegidas y firmas/cuerpos JNI conservados. Código nativo dividido por responsabilidad con una sesión compartida.
          APK debug del commit be1272a7b0a7a9b5094a2af286a496cf685d4288. Se publica después de compilar y aprobar las pruebas del núcleo y Android.
          Descargar Velyntora-Core-Modular.apk. SHA-256 adjunta.
          NOTES
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "${{ github.sha }}" --title "Velyntora Core — componentes modulares" --notes-file notes.md --prerelease
          fi
          gh release upload "$RELEASE_TAG" Velyntora-Core-Modular.apk Velyntora-Core-Modular.apk.sha256 --repo "$GH_REPO" --clobber
