name: Publish experimental performance APK
on:
  push:
    branches: [codex/large-canvas-12000]
    paths: [.github/workflows/publish-large-canvas-preview.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: experimental-large-canvas-preview
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERIFIED_SHA: 3182a14bd65b193df0860ac5f9ecec56512d1fbb
      RELEASE_TAG: v0.1.0-10000px-paged-preview
    steps:
      - uses: actions/checkout@v4
      - name: Require exact experimental source checks
        run: |
          set -euo pipefail
          for run_id in 38147050592 38147050568 38147050481 38147050495; do
            for attempt in $(seq 1 85); do
              gh api "repos/$GH_REPO/actions/runs/$run_id" > run.json
              jq -e --arg sha "$VERIFIED_SHA" '.head_sha == $sha and .head_branch == "codex/large-canvas-12000"' run.json
              if jq -e '.status == "completed"' run.json >/dev/null; then
                jq -e '.conclusion == "success"' run.json
                break
              fi
              test "$attempt" -lt 85
              sleep 20
            done
          done
      - name: Download verified APK
        run: |
          set -euo pipefail
          gh run download 38147050592 --repo "$GH_REPO" --name velyntora-core-debug-apk --dir apk
          test "$(find apk -name '*.apk' -type f | wc -l)" -eq 1
          cp apk/*.apk Velyntora-Core-10000px-Experimental.apk
          sha256sum Velyntora-Core-10000px-Experimental.apk > Velyntora-Core-10000px-Experimental.apk.sha256
      - name: Publish experimental prerelease
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Rama experimental; main permanece intacta. El nombre histórico de la rama conserva 12000, pero el límite funcional es **10.000 × 10.000 px** y se rechaza cualquier lado mayor.
          JPEG y PNG se importan a resolución original, incluyendo 6067 × 9030. La importación usa regiones o franjas acotadas; PNG RGB/RGBA sin perfiles personalizados se decodifica en una sola pasada. Los perfiles de color usan el decodificador Android. Un fallo durante la importación mantiene el documento anterior.
          El lienzo y las capas comparten páginas de 4096 píxeles con copia al modificar. Las capas vacías guardan sólo su color base. La caché residente nativa se limita a 16 MiB y las páginas restantes usan archivos temporales de sesión. El tamaño del documento no implica reservar un Bitmap completo en la vista: se presentan teselas nativas y una vista previa acotada. Las texturas son modificables y conservan actualizaciones parciales durante los trazos.
          El historial no tiene un corte fijo por cantidad de pasos; usa bloques inmutables archivados y restauración diferida. El almacenamiento disponible es su límite práctico y el historial dura la sesión. Se conserva la geometría de los pinceles y Línea/Curva. Efectos y transformaciones usan buffers paginados; PNG, BMP, TGA, TIFF, GIF y PPM se exportan por filas originales.
          Pruebas: núcleo, límites, mezcla de capas, 140 pasos nativos de deshacer/rehacer en 10000 × 10000, 150 estados archivados, importación PNG original de 10000 × 10000 con la JVM limitada a 96 MB, ocho orientaciones EXIF y recuperación de archivos corruptos. Android: 47 pruebas con fuente normal y otras 47 con fuente grande; creación de 10000 × 10000 con 32 capas vacías, trazos e historial, e importación de 6067 × 9030 con trazos continuos y medición de cuadros.
          Las máscaras densas, Remove AI y algunos códecs que todavía necesitan buffers completos mantienen requisitos mayores de memoria. El rendimiento depende del dispositivo, del contenido y del número de capas; los resultados del emulador no garantizan 60 FPS en cualquier equipo. Versión experimental para revisión, sin integrar a main.
          APK debug del commit 3182a14bd65b193df0860ac5f9ecec56512d1fbb, publicado sólo tras aprobar núcleo, almacenamiento, compilación y Android. SHA256 adjunta.
          NOTES
          # The release tag points at this publishing commit. The APK remains pinned to VERIFIED_SHA.
          # Reject any application-code difference between the verified build and this tag.
          gh api "repos/$GH_REPO/compare/$VERIFIED_SHA...$GITHUB_SHA" --jq '.files' | jq -e 'all(.filename == ".github/workflows/publish-large-canvas-preview.yml")'
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "Velyntora Core — 10.000 px y motor por bloques" --notes-file notes.md --prerelease
          fi
          gh release upload "$RELEASE_TAG" Velyntora-Core-10000px-Experimental.apk Velyntora-Core-10000px-Experimental.apk.sha256 --repo "$GH_REPO" --clobber
