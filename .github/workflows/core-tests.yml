name: Core tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Viewport coordinate tests
        run: |
          mkdir -p build/java-tests
          javac -d build/java-tests app/src/main/java/art/velyntora/core/Viewport.java tests/ViewportTests.java
          java -cp build/java-tests art.velyntora.core.ViewportTests
      - name: Image decode sizing tests
        run: |
          javac -d build/java-tests app/src/main/java/art/velyntora/core/ImageDecodePolicy.java tests/ImageDecodePolicyTests.java
          java -cp build/java-tests art.velyntora.core.ImageDecodePolicyTests
      - name: Responsive workspace layout tests
        run: |
          javac -d build/java-tests app/src/main/java/art/velyntora/core/WorkspaceLayout.java tests/WorkspaceLayoutTests.java
          java -cp build/java-tests art.velyntora.core.WorkspaceLayoutTests
      - name: Tone curve interpolation tests
        run: |
          javac -d build/java-tests app/src/main/java/art/velyntora/core/ToneCurve.java tests/ToneCurveTests.java
          java -cp build/java-tests art.velyntora.core.ToneCurveTests
      - name: BMP and TGA export tests
        run: |
          javac -d build/java-tests app/src/main/java/art/velyntora/core/RasterFileWriter.java tests/RasterFileWriterTests.java app/src/main/java/art/velyntora/core/TgaReader.java tests/TgaReaderTests.java
          java -cp build/java-tests art.velyntora.core.RasterFileWriterTests
          java -cp build/java-tests art.velyntora.core.TgaReaderTests
      - name: PPM file interchange tests
        run: |
          javac -d build/java-tests app/src/main/java/art/velyntora/core/{VlyProjectStream,OpenRasterArchive,RasterFileWriter,PpmCodec}.java tests/PpmCodecTests.java
          java -cp build/java-tests art.velyntora.core.PpmCodecTests
      - name: ICO file interchange tests
        run: |
          javac -d build/java-tests app/src/main/java/art/velyntora/core/{VlyProjectStream,OpenRasterArchive,RasterFileWriter,IcoCodec}.java tests/IcoCodecTests.java
          java -cp build/java-tests art.velyntora.core.IcoCodecTests
      - name: GIF file export tests
        run: |
          javac -d build/java-tests app/src/main/java/art/velyntora/core/{RasterFileWriter,GifWriter}.java tests/GifWriterTests.java
          java -cp build/java-tests art.velyntora.core.GifWriterTests
      - name: TIFF file export tests
        run: |
          javac -d build/java-tests app/src/main/java/art/velyntora/core/RasterFileWriter.java app/src/main/java/art/velyntora/core/TiffWriter.java tests/TiffWriterTests.java
          java -cp build/java-tests art.velyntora.core.TiffWriterTests
      - name: TIFF file import tests
        run: |
          javac -d build/java-tests app/src/main/java/art/velyntora/core/{VlyProjectStream,OpenRasterArchive,RasterFileWriter,TiffWriter,TiffReader}.java tests/TiffReaderTests.java
          java -cp build/java-tests art.velyntora.core.TiffReaderTests
      - name: OpenRaster project interchange tests
        run: |
          javac -d build/java-tests app/src/main/java/art/velyntora/core/VlyProjectStream.java app/src/main/java/art/velyntora/core/OpenRasterArchive.java tests/OpenRasterTests.java
          java -cp build/java-tests art.velyntora.core.OpenRasterTests
      - run: cmake -S tests -B build/tests -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/tests --parallel
      - run: ctest --test-dir build/tests --output-on-failure
      - name: Native bridge project integration tests
        run: |
          g++ -std=c++20 -Icore/include -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" tests/native_project_tests.cpp core/src/Canvas.cpp core/src/LayerDocument.cpp core/src/ProjectIO.cpp core/src/PixelEffects.cpp core/src/SelectionTransform.cpp core/src/ColorAdjustments.cpp core/src/BlurEffects.cpp core/src/DistortionEffects.cpp core/src/ArtisticEffects.cpp core/src/RenderEffects.cpp core/src/UtilityEffects.cpp core/src/ObjectEffects.cpp -o build/native_project_tests
          build/native_project_tests
      - name: JVM to native raster integration tests
        run: |
          g++ -shared -fPIC -std=c++20 -Icore/include -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" app/src/main/cpp/native_bridge.cpp core/src/Canvas.cpp core/src/LayerDocument.cpp core/src/ProjectIO.cpp core/src/PixelEffects.cpp core/src/SelectionTransform.cpp core/src/ColorAdjustments.cpp core/src/BlurEffects.cpp core/src/DistortionEffects.cpp core/src/ArtisticEffects.cpp core/src/RenderEffects.cpp core/src/UtilityEffects.cpp core/src/ObjectEffects.cpp -o build/libvelyntora_host.so
          javac -d build/java-tests tests/NativeRasterTests.java
          java -Djava.library.path=build -cp build/java-tests art.velyntora.core.NativeRasterTests
