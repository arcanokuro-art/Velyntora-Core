plugins { id 'com.android.application' }
android {
 namespace 'art.velyntora.core'
 compileSdk 35
 defaultConfig {
  applicationId 'art.velyntora.core'
  minSdk 23
  targetSdk 28
  versionCode 1
  versionName '0.1.0'
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  externalNativeBuild { cmake { cppFlags '-std=c++20 -Wall -Wextra' } }
 }
 externalNativeBuild { cmake { path file('../core/CMakeLists.txt'); version '3.22.1' } }
 sourceSets { main { java.srcDirs += ['../tools'] } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
 implementation 'com.caverock:androidsvg-aar:1.4'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
